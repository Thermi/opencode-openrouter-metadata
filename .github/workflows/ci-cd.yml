name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to build
        required: true
        default: nightly
        type: choice
        options: [nightly, stable]

permissions:
  contents: write
  actions: write

concurrency:
  group: opencode-metadata-release-automation
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.context.outputs.matrix }}
      channels: ${{ steps.context.outputs.channels }}
      source_refs: ${{ steps.context.outputs.source_refs }}
      publish: ${{ steps.context.outputs.publish }}
      versions: ${{ steps.context.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          CI_CHANNEL: ${{ inputs.channel || 'nightly' }}
        run: |
          context="$(node scripts/ci-discover.mjs)"
          matrix="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.matrix)' "$context")"
          channels="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.channels.join(","))' "$context")"
          source_refs="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(x.sourceRefs))' "$context")"
          versions="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.versions.join(","))' "$context")"
          publish="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.publish))' "$context")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "channels=$channels" >> "$GITHUB_OUTPUT"
          echo "source_refs=$source_refs" >> "$GITHUB_OUTPUT"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run

  build:
    needs: [discover, test]
    if: ${{ needs.discover.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run build
        env:
          OPENCODE_VERSION: ${{ matrix.opencode_version }}
      - name: Pack variant
        shell: bash
        run: |
          mkdir -p release-assets
          package_file="$(npm pack --pack-destination release-assets | tail -n 1)"
          mv "release-assets/$package_file" "release-assets/opencode-openrouter-metadata-${{ matrix.channel }}-opencode-${{ matrix.opencode_version }}.tgz"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.channel }}-${{ matrix.opencode_version }}
          path: release-assets/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [discover, build]
    if: >-
      ${{
        needs.discover.outputs.publish == 'true' &&
        (
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Publish GitHub releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_ARTIFACT_DIRECTORY: release-assets
          RELEASE_CHANNELS: ${{ needs.discover.outputs.channels }}
          RELEASE_SOURCE_REFS: ${{ needs.discover.outputs.source_refs }}
          OPENCODE_VERSIONS: ${{ needs.discover.outputs.versions }}
          RELEASE_SOURCE_REF: ${{ github.ref_name || 'main' }}
        run: node scripts/ci-publish.mjs
      - name: Enforce compatibility release retention
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_STORAGE_THRESHOLD_BYTES: ${{ vars.RELEASE_STORAGE_THRESHOLD_BYTES || '200000000' }}
        run: node scripts/ci-retention.mjs

  npm-publish:
    needs: [discover, build]
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref_type == 'tag' &&
        startsWith(github.ref_name, 'v') &&
        needs.discover.outputs.publish == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v8
        with:
          pattern: package-compatibility-*
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Select newest compatibility package
        id: package
        shell: bash
        run: |
          package_file="$(find release-assets -type f -name '*-compatibility-opencode-*.tgz' -print | sort -V | tail -n 1)"
          test -n "$package_file"
          echo "path=$package_file" >> "$GITHUB_OUTPUT"
      - name: Verify package version matches release tag
        shell: bash
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.path }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          archive_version="$(tar -xOf "$PACKAGE_FILE" package/package.json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version))')"
          test "$archive_version" = "${RELEASE_VERSION#v}"
      - name: Publish package to npm
        run: npm publish "./$PACKAGE_FILE" --access public --provenance --registry=https://registry.npmjs.org
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.path }}
